<!DOCTYPE html>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Outfit:wght@700;800;900&display=swap');
    
    html, body {
      font-family: 'Zen Maru Gothic', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Bold stylish numbers font */
    .num-font {
      font-family: 'Outfit', 'Zen Maru Gothic', sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    /* Custom Independent Scrollbar */
    .scroll-container::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .scroll-container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    /* Animations */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .animate-float {
      animation: floaty 2.5s ease-in-out infinite;
    }

    @keyframes badgeFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-3px) scale(1.03); }
    }
    .animate-badge {
      animation: badgeFloat 1.8s ease-in-out infinite;
    }

    /* Floating Arrow Animations for Scroll Container */
    @keyframes arrowBounceUp {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -4px); }
    }
    @keyframes arrowBounceDown {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, 4px); }
    }
    .animate-arrow-up {
      animation: arrowBounceUp 1.2s ease-in-out infinite;
    }
    .animate-arrow-down {
      animation: arrowBounceDown 1.2s ease-in-out infinite;
    }

    @keyframes blinkFast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .animate-blink-fast {
      animation: blinkFast 0.8s ease-in-out infinite;
    }

    /* Speech bubble tail */
    .speech-bubble-left {
      position: relative;
    }
    .speech-bubble-left::after {
      content: '';
      position: absolute;
      top: 50%;
      right: -5px;
      transform: translateY(-50%);
      border-width: 4px 0 4px 5px;
      border-style: solid;
      border-color: transparent transparent transparent #10b981;
      display: block;
      width: 0;
    }

    /* Disabled UI State when Modal is open (Including Bag Button) */
    .modal-active-overlay button:not(#modal-container button) {
      pointer-events: none !important;
      filter: brightness(0.5) grayscale(0.3) !important;
    }
  </style>
</head>

    async function generateFlavorText(prompt) {
      if (!apiKey) return null;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
      const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        systemInstruction: { parts: [{ text: "あなたは可愛い海のゲームのキャラクターです。語尾や口調をキャラクターに合わせて、短く楽しいフレーバーテキスト（1〜2文）を作成してください。" }] }
      };

      let retries = 5;
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            const data = await res.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text;
          }
        } catch (e) {}
        await new Promise(r => setTimeout(r, delay));
        delay *= 2;
      }
      return null;
    }

      });

      state.devModeUnlocked = false;
      state.ancientCityInvested = 0;

      const initWeapon = {
        uid: generateUid(),
        id: 'favorite_stone',
        type: 'weapon',
        hitRate: 20,
        def: 0,
        upgradedHit: 0,
        upgradedDef: 0,
        upgrades: 0
      };
      state.bag.push(initWeapon);
      state.equippedWeaponUid = initWeapon.uid;
      state.equippedArmorUid = null;

      refreshDolphinShop();
      updateHeaderStats();
      renderHomeScreen();
    }

    function addDevShells() {
      state.shells += 100000;
      updateHeaderStats();
    }

    function generateUid() {
      return 'item_' + Math.random().toString(36).substr(2, 9);
    }

    function getPlayerHitRate() {
      let base = 10;
      if (state.equippedWeaponUid) {
        const weapon = state.bag.find(i => i.uid === state.equippedWeaponUid);
        if (weapon) {
          const master = ITEMS[weapon.id];
          base += master.hitRate + weapon.upgradedHit;
        }
      }
      if (state.battle) {
        if (state.battle.hitRatePenalty) base -= state.battle.hitRatePenalty;
        if (state.battle.hitRateHalved) base = Math.ceil(base / 2);
        if (state.battle.buffHitMultiplier) base *= state.battle.buffHitMultiplier;
        if (state.battle.courageActive) base *= 2;
      }
      return Math.max(0, base);
    }

    function getPlayerDef() {
      let base = 0;
      if (state.equippedArmorUid) {
        const armor = state.bag.find(i => i.uid === state.equippedArmorUid);
        if (armor) {
          const master = ITEMS[armor.id];
          base += master.def + armor.upgradedDef;
        }
      }
      return base;
    }

    function updateHeaderStats() {
      document.getElementById('stat-satiety').innerText = `${state.satiety} / ${state.maxSatiety}`;
      document.getElementById('stat-shells').innerText = state.shells;
      document.getElementById('stat-depth').innerText = state.depth;
      document.getElementById('stat-max-depth').innerText = state.maxDepth;
      document.getElementById('header-bag-count').innerText = `(${state.bag.length}/20)`;

      document.getElementById('header-hitrate').innerText = `${getPlayerHitRate()}%`;
      document.getElementById('header-def').innerText = `${getPlayerDef()}`;

      const iconEl = document.getElementById('btn-bag-icon');
      const textEl = document.getElementById('btn-bag-text');
      if (iconEl && textEl) {
        if (state.isBagOpen) {
          iconEl.innerText = '❌';
          textEl.innerText = '閉じる';
        } else {
          iconEl.innerText = '🎒';
          textEl.innerText = 'かばん';
        }
      }

      const sellBadge = document.getElementById('header-sell-badge');
      if (sellBadge) {
        if (state.isMarket) sellBadge.classList.remove('hidden');
        else sellBadge.classList.add('hidden');
      }

      const btnBag = document.getElementById('btn-bag');
      if (btnBag) {
        if (state.pendingTargetItem) {
          btnBag.classList.add('pointer-events-none', 'brightness-50', 'grayscale');
        } else {
          btnBag.classList.remove('pointer-events-none', 'brightness-50', 'grayscale');
        }
      }
    }

    function consumeSatiety(amount, isBattleContext = false) {
      state.satiety -= amount;
      if (state.satiety <= 0) {
        const cakeIdx = state.bag.findIndex(i => i.id === 'cake');
        if (cakeIdx !== -1) {
          state.bag.splice(cakeIdx, 1);
          state.satiety = 100;
          showModal('🎂 ごちそうケーキ発動！', '<p class="text-center font-bold text-amber-400">満腹度が尽きそうになったが、ごちそうケーキを食べて満腹度が<span class="num-font">100</span>回復した！</p>', [
            { text: '助かった！', class: 'bg-emerald-500 text-white font-bold', cb: () => updateHeaderStats() }
          ]);
          return false;
        }

        state.satiety = 0;
        updateHeaderStats();
        if (!isBattleContext) handleDeathPenalty();
        return true;
      }
      updateHeaderStats();
      return false;
    }

    function handleDeathPenalty() {
      clearDebuffs(true);
      syncFavoriteStoneDolphinStock();
      refreshDolphinShop();
      const lostShells = Math.floor(state.shells / 2);
      state.shells -= lostShells;

      let lostItemName = 'なし';
      if (state.bag.length > 0) {
        const rndIdx = Math.floor(Math.random() * state.bag.length);
        const lost = state.bag.splice(rndIdx, 1)[0];
        lostItemName = ITEMS[lost.id].name;
        if (state.equippedWeaponUid === lost.uid) state.equippedWeaponUid = null;
        if (state.equippedArmorUid === lost.uid) state.equippedArmorUid = null;
      }

      syncFavoriteStoneDolphinStock();

      let reliefGiven = false;
      if (state.shells <= 50) {
        state.shells += 100;
        reliefGiven = true;
      }

      showModal('💭 お腹ぺこぺこ…', `
        <div class="text-center space-y-2">
          <p class="text-blue-400 font-black text-sm">満腹度が <span class="num-font">0</span> になった…</p>

    function attachScrollGuide(elId) {
      setTimeout(() => {
        const el = document.getElementById(elId);
        const upArrow = document.getElementById(elId + '-arrow-up');
        const downArrow = document.getElementById(elId + '-arrow-down');
        if (!el) return;

        const updateArrows = () => {
          const hasScroll = el.scrollHeight > el.clientHeight;
          if (!hasScroll) {
            if (upArrow) upArrow.classList.add('hidden');
            if (downArrow) downArrow.classList.add('hidden');
            return;
          }
          if (upArrow) {
            if (el.scrollTop > 5) upArrow.classList.remove('hidden');
            else upArrow.classList.add('hidden');
          }
          if (downArrow) {
            if (el.scrollTop < el.scrollHeight - el.clientHeight - 5) downArrow.classList.remove('hidden');
            else downArrow.classList.add('hidden');
          }
        };

        el.onscroll = updateArrows;
        updateArrows();
      }, 50);
    }

    function startExploration() {

        state.depth = 1;
        if (state.depth > state.maxDepth) state.maxDepth = state.depth;
        refreshDolphinShop();

      state.isMarket = false;
      state.isBagOpen = false;
      generateCards();
      renderCardSelectionScreen();

    function generateCards() {
      if (state.depth >= LAST_DEPTH) {
        state.currentCards = [{ hole: 'boss_hole', label: '', prob: { boss: 100 } }];
        return;
      }

      if (state.debuffs.forceSkirmishNext) {
        state.debuffs.forceSkirmishNext = false;
        state.currentCards = [
          { hole: 'skirmish', label: '', prob: generateSkirmishProb() },
          { hole: 'skirmish', label: '', prob: generateSkirmishProb() },
          { hole: 'skirmish', label: '', prob: generateSkirmishProb() }
        ];
        return;
      }

      if (state.debuffs.forceStrongNext) {
        state.debuffs.forceStrongNext = false;
        state.currentCards = [
          { hole: 'strong_enemy', label: '', prob: generateStrongEnemyProb() },
          { hole: 'strong_enemy', label: '', prob: generateStrongEnemyProb() },
          { hole: 'strong_enemy', label: '', prob: generateStrongEnemyProb() }
        ];
        return;
      }

      const specialPool = ['skirmish', 'danger_feed', 'strong_enemy', 'treasure_sign', 'chaos', 'oasis', 'market', 'smith', 'shortcut'];
      const specialWeights = [25, 25, 25, 5, 10, 3, 3, 3, 1];

      const numSpecials = Math.random() < 0.5 ? 1 : 2;
      const cardHoles = ['normal', 'normal', 'normal'];
      const indices = [0, 1, 2].sort(() => Math.random() - 0.5).slice(0, numSpecials);

      indices.forEach(idx => {
        cardHoles[idx] = getRandomWeighted(specialPool, specialWeights);
      });

      state.currentCards = cardHoles.map(holeKey => {
        let prob;
        switch (holeKey) {
          case 'normal': prob = generateNormalProb(); break;
          case 'skirmish': prob = generateSkirmishProb(); break;
          case 'danger_feed': prob = generateDangerFeedProb(); break;
          case 'strong_enemy': prob = generateStrongEnemyProb(); break;
          case 'treasure_sign': prob = generateTreasureSignProb(); break;
          case 'chaos': prob = generateChaosProb(); break;
          default: prob = HOLE_TYPES[holeKey].baseProb;
        }

        return { hole: holeKey, label: '', prob: prob };
      });
    }

    function generateNormalProb() {
      const enemy = Math.floor(Math.random() * 21) + 30;
      const treasure = Math.floor(Math.random() * 6) + 17;
      const food = Math.floor(Math.random() * 6) + 23;
      const remain = Math.max(0, 100 - (enemy + treasure + food));
      const market = Math.floor(remain / 2);
      const smith = remain - market;
      return { enemy, treasure, food, market, smith };
    }

    function generateSkirmishProb() {
      const enemy = Math.floor(Math.random() * 21) + 60;
      return { enemy, treasure: 100 - enemy };
    }

    function generateDangerFeedProb() {
      const enemy = Math.floor(Math.random() * 21) + 40;
      return { enemy, food: 100 - enemy };
    }

    function generateStrongEnemyProb() {
      const strongEnemy = Math.floor(Math.random() * 41) + 50;
      return { strongEnemy, treasure: 100 - strongEnemy };
    }

    function generateTreasureSignProb() {
      const strongEnemy = Math.floor(Math.random() * 21);
      const treasure = Math.floor(Math.random() * 11) + 70;
      const trap = Math.max(0, 100 - (strongEnemy + treasure));
      return { strongEnemy, treasure, trap };
    }

    function generateChaosProb() {
      const raw = Array.from({length: 8}, () => Math.floor(Math.random() * 20) + 5);
      const sum = raw.reduce((a, b) => a + b, 0);
      const normalized = raw.map(v => Math.round((v / sum) * 100));
      let diff = 100 - normalized.reduce((a, b) => a + b, 0);
      normalized[0] += diff;

      return {
        strongEnemy: normalized[0],
        enemy: normalized[1],
        treasure: normalized[2],
        food: normalized[3],
        trap: normalized[4],
        market: normalized[5],
        smith: normalized[6],
        return: normalized[7]
      };
    }

    function getRandomWeighted(items, weights) {
      const totalWeight = weights.reduce((a, b) => a + b, 0);
      let random = Math.random() * totalWeight;
      for (let i = 0; i < items.length; i++) {
        if (random < weights[i]) return items[i];
        random -= weights[i];
      }
      return items[0];
    }

      let currentDeg = 0;

        const colorHex = EVENT_META[key]?.hex || '#94a3b8';
        gradientStops.push(`${colorHex} ${currentDeg}deg ${nextDeg}deg`);
        currentDeg = nextDeg;
      });

      return `conic-gradient(${gradientStops.join(', ')})`;
    }

      }
      return 'enemy';

      }

      state.shells -= cost;
      item.upgrades = (item.upgrades || 0) + 1;
      let upgradeLogText = '';

      if (item.type === 'weapon') {
        const prev = master.hitRate + item.upgradedHit;
        item.upgradedHit += 2;
        const next = master.hitRate + item.upgradedHit;
        upgradeLogText = `撃退率: <span class="num-font">+${prev}%</span> ➔ <span class="num-font text-emerald-400 font-bold">+${next}%</span> (<span class="num-font">+2%</span>)`;
      } else {
        const prev = master.def + item.upgradedDef;
        item.upgradedDef += 2;
        const next = master.def + item.upgradedDef;
        upgradeLogText = `防御力: <span class="num-font">+${prev}</span> ➔ <span class="num-font text-emerald-400 font-bold">+${next}</span> (<span class="num-font">+2</span>)`;
      }

      if (item.id === 'favorite_stone') {
        state.favoriteStoneUpgrades.upgrades = item.upgrades;
        state.favoriteStoneUpgrades.upgradedHit = item.upgradedHit;
      }

      updateHeaderStats();

      const npcTalk = "バッチリ仕上がったぜ！";

      showModal('🔨 強化完了！', `
        <div class="text-center space-y-2">
          <div class="text-4xl">✨🐙✨</div>
          <p class="text-sm font-bold text-sky-300">${master.name} <span class="text-orange-400 font-extrabold">🔥<span class="num-font">${item.upgrades}</span></span> になった！</p>
          <div class="bg-slate-900 p-2 rounded-xl text-xs font-bold border border-sky-800/80">
            ${upgradeLogText}
          </div>
          <p class="text-xs text-slate-300">「${npcTalk}」</p>
        </div>
      `, [
        {
          text: '感謝して次の階層へ',
          class: 'bg-sky-500 hover:bg-sky-400 text-white font-bold',
          cb: () => advanceDepth()
        }
      ]);
    }

    function handleReturnEvent() {
      showModal('✨ 無事に帰還！', `
        <div class="text-center space-y-2 my-2">
          <div class="text-5xl">🏡</div>
          <p class="text-sm font-bold text-slate-200">ラッコはおうちに帰った！</p>
        </div>
      `, [
        {
          text: 'ただいま',
          class: 'bg-white hover:bg-slate-100 text-slate-950 font-black',
          cb: () => renderHomeScreen()
        }
      ]);
    }

    function advanceDepth() {
      state.depth++;
      if (state.depth > state.maxDepth) state.maxDepth = state.depth;
      startExploration();
    }

    function handleDungeonClear() {
      showModal('🎉 洞窟制覇！', `
        <div class="text-center space-y-2">
          <div class="text-6xl">🏆🦦</div>
          <h3 class="font-bold text-lg text-amber-400">最後の階層（深さ<span class="num-font">${state.depth}</span>）を達成！</h3>
          <p class="text-xs text-slate-300">無事に洞窟の最奥から帰還しました！おめでとう！</p>
        </div>
      `, [
        {
          text: 'おうちへ戻る',
          class: 'bg-amber-400 text-slate-950 font-black',
          cb: () => renderHomeScreen()
        }
      ]);
    }

    // --- BATTLE SYSTEM ---
    function checkCourage() {
      const b = state.battle;
      if (!b || b.turn !== 'player' || b.courageActive) return;

      const fails = b.consecutiveFails || 0;
      let prob = 0.01;
      if (fails === 1) prob = 0.03;
      else if (fails === 2) prob = 0.10;
      else if (fails === 3) prob = 0.32;
      else if (fails >= 4) prob = 1.00;

      if (Math.random() < prob) {
        b.courageActive = true;
        b.log.push('❤️‍🔥 ラッコは勇気を出した！ 撃退率が一度だけ <span class="num-font">2</span> 倍になる！');
      }
    }

    function startBattle(type) {
      state.currentScreen = 'battle';

      let enemyObj;
      let isStrong = false;
      let isBoss = false;

      if (type === 'boss') {
        isBoss = true;
        enemyObj = { name: 'さびたロボット', icon: '🤖', atk: 121 };
      } else {
        let validEnemies = ENEMIES.filter(e => state.depth >= e.minD && state.depth <= e.maxD);
        if (validEnemies.length === 0) validEnemies = [ENEMIES[0]];

        enemyObj = validEnemies[Math.floor(Math.random() * validEnemies.length)];

        if (type === 'strong') {
          isStrong = true;
          const strongIdx = Math.min(ENEMIES.length - 1, ENEMIES.indexOf(enemyObj) + 2);
          enemyObj = ENEMIES[strongIdx];
        }
      }

      const isPlayerTurn = Math.random() < 0.5;

      state.battle = {
        isStrong: isStrong,
        isBoss: isBoss,
        enemy: enemyObj,
        turn: isPlayerTurn ? 'player' : 'enemy',
        buffHitMultiplier: 1,
        courageActive: false,
        consecutiveFails: 0,
        hitRatePenalty: 0,
        hitRateHalved: false,
        disableTreasure: false,
        disableFood: false,
        usedSpecialAction: false,
        isBlownAway: false,
        log: []
      };

      if (isPlayerTurn) {
        state.battle.log.push(`🎲 ラッコ の先攻！`);
        state.battle.log.push('ラッコの番');
        checkCourage();
      } else {
        state.battle.log.push(`🎲 ${enemyObj.name} の先攻！`);
        state.battle.log.push('敵の番');
      }

      renderBattleScreen();
    }

    function renderBattleScreen() {
      state.currentScreen = 'battle';
      updateHeaderStats();
      const main = document.getElementById('main-content');
      const b = state.battle;

      const hitRate = getPlayerHitRate();
      const rawDmg = Math.max(1, b.enemy.atk - getPlayerDef());

      main.innerHTML = `
        <div class="flex flex-col h-full justify-between pb-2">
          <div>
            <div class="text-center mb-2">
              <span class="${b.isBoss ? 'bg-indigo-900 text-white border border-indigo-700' : b.isStrong ? 'bg-red-950 text-white border border-red-600' : 'bg-red-800 text-white'} font-bold px-3 py-0.5 rounded-full text-xs shadow">
                ${b.isBoss ? '⚓️ ぬしと遭遇！' : b.isStrong ? '💀 強敵と遭遇！' : '⚔️ 敵と遭遇！'}
              </span>
            </div>

            ${b.isEnemyCleared ? '' : `
            <div class="bg-gradient-to-b from-slate-900 to-slate-950 text-white p-4 rounded-2xl text-center shadow-lg border border-red-900/50 mb-3">
              <div class="text-6xl my-1 ${b.isEnemyCleared ? 'opacity-0' : 'animate-float'}">${b.enemy.icon}</div>
              <h3 class="font-black text-base sm:text-lg ${b.isStrong ? 'text-red-400' : 'text-slate-100'} ${b.isEnemyCleared ? 'opacity-0' : ''}">${b.enemy.name}</h3>
              <p class="text-xs text-slate-400 ${b.isEnemyCleared ? 'opacity-0' : ''}">攻撃力: <span class="num-font text-white font-bold">${b.enemy.atk}</span></p>
            </div>
            `}

            <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-800 text-xs h-36 overflow-y-auto space-y-1 mb-3 scroll-container" id="battle-log">
              ${b.log.map(l => {
                if (l === 'ラッコの番' || l === '敵の番') {
                  return `<div class="flex items-center my-1 text-slate-400 font-bold text-xs"><div class="flex-1 border-t border-slate-700"></div><span class="px-2 flex-shrink-0">${l}</span><div class="flex-1 border-t border-slate-700"></div></div>`;
                }
                return `<p class="text-slate-200 font-medium">${l}</p>`;
              }).join('')}
            </div>
          </div>

          <div class="space-y-2 mb-4">
            ${b.turn === 'player' ? `
              <button onclick="handlePlayerAttack()" class="w-full bg-red-600 hover:bg-red-500 text-white font-black py-4 rounded-2xl shadow-lg border-b-4 border-red-900 flex items-center justify-between px-6 text-base active:scale-95 transition">
                <span>立ち向かう</span>
                <span class="bg-black/40 text-yellow-300 px-3 py-1 rounded-full text-xs num-font">撃退率: ${hitRate}%</span>
              </button>
            ` : b.turn === 'enemy' ? `
              <button onclick="handleEnemyAttack()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-2xl shadow-lg border-b-4 border-blue-900 flex items-center justify-between px-6 text-base active:scale-95 transition">
                <span>立ち向かう</span>
                <span class="bg-black/40 text-cyan-200 px-3 py-1 rounded-full text-xs num-font">推定被ダメージ: ${rawDmg}</span>
              </button>
            ` : `
              <button ${b.isEnemyCleared ? 'disabled' : 'onclick="handleConfirmPhase()"'} class="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-black py-4 rounded-2xl shadow-lg border-b-4 border-slate-900 flex items-center justify-end px-6 text-base ${b.isEnemyCleared ? '' : 'active:scale-95 transition'}">
                <span class="${b.isEnemyCleared ? '' : 'animate-blink-fast'}">${b.isEnemyCleared ? '　' : '▼'}</span>
              </button>
            `}
          </div>
        </div>
      `;

      const logEl = document.getElementById('battle-log');
      if (logEl) logEl.scrollTop = logEl.scrollHeight;
    }

    function handlePlayerAttack() {
      const b = state.battle;
      const hitRate = getPlayerHitRate();
      const rand = Math.random() * 100;

      const wasCourage = b.courageActive;

      // 攻撃後は成否問わず勇気状態とビタミン剤倍率をリセット
      b.courageActive = false;
      b.buffHitMultiplier = 1;

      if (rand <= hitRate) {
        b.consecutiveFails = 0;
        
        const earnedShells = b.isBoss ? (50 + state.depth * 40) * 2 : (50 + state.depth * 40);
        const dropChance = b.isBoss ? 0 : (b.isStrong ? 1.0 : 0.25);
        let droppedItem = null;

        if (Math.random() <= dropChance && !b.isBoss) {
          const rank = b.enemy.ranks[Math.floor(Math.random() * b.enemy.ranks.length)];
          const potentialDrops = Object.values(ITEMS).filter(i => i.rank === rank && i.id !== 'favorite_stone');
          if (potentialDrops.length > 0) {
            droppedItem = potentialDrops[Math.floor(Math.random() * potentialDrops.length)];
          }
        }

        let clearDebuffLog = [];
        if (b.disableTreasure) clearDebuffLog.push('⚡️ しびれが治った');
        if (b.disableFood) clearDebuffLog.push('🫟 墨をふき取った');

        b.winData = {
          earnedShells,
          droppedItem,
          clearDebuffLog
        };

        b.log.push('🎯 ラッコ の攻撃！ 当たり！');
        b.turn = 'player_confirm';
        renderBattleScreen();
      } else {
        if (wasCourage) {
          b.consecutiveFails = 0;
        } else {
          b.consecutiveFails = (b.consecutiveFails || 0) + 1;
        }
        b.log.push('💫 ラッコ の攻撃！ はずれ…！');
        b.turn = 'player_confirm';
        renderBattleScreen();
      }
    }

    function handleEnemyAttack() {
      const b = state.battle;
      const enemyName = b.enemy.name;

      let performedSpecial = false;

      if (!b.usedSpecialAction) {
        if (enemyName === 'さびたロボット' && Math.random() < 0.6) {
          b.log.push('🌪️ さびたロボットは竜巻をおこした！ ラッコは <span class="num-font">1</span> つ前の階層へ戻されてしまった！');
          b.isBlownAway = true;
          performedSpecial = true;
        } else if (enemyName === 'いじわるなカニ' && Math.random() < 0.5) {
          b.log.push('⚔️ いじわるなカニは騒いだ！ 次の階層が一触即発になった！');
          state.debuffs.forceSkirmishNext = true;
          performedSpecial = true;
        } else if (enemyName === 'チクチククラゲ' && Math.random() < 0.5) {
          b.log.push('⚡️ チクチククラゲはしびれ針で刺した！ お宝を使えなくなった！');
          b.disableTreasure = true;
          performedSpecial = true;
        } else if (enemyName === 'ずるいウミヘビ' && Math.random() < 0.5) {
          b.log.push('💨 ずるいウミヘビはこそこそしている！ 撃退率 <span class="num-font">10%</span> 低下！');
          b.hitRatePenalty += 10;
          performedSpecial = true;
        } else if (enemyName === 'ダイオウイカ' && Math.random() < 0.5) {
          b.log.push('🫟 ダイオウイカは墨を吐いた！ 食べ物を使えなくなった！');
          b.disableFood = true;
          performedSpecial = true;
        } else if (enemyName === '幽霊船' && Math.random() < 0.5) {
          b.log.push('💀 幽霊船の呪い！ 次の階層がすべて強敵の縄張りになった！');
          state.debuffs.forceStrongNext = true;
          performedSpecial = true;
        } else if (enemyName === 'まぼろし龍') {
          b.log.push('💨 まぼろし龍は雲隠れした！ 撃退率半減！');
          b.hitRateHalved = true;
          performedSpecial = true;
        }

        if (performedSpecial) {
          b.usedSpecialAction = true;
          b.turn = 'enemy_confirm';
          renderBattleScreen();
          return;
        }
      }

      const dmg = Math.max(1, b.enemy.atk - getPlayerDef());
      const died = consumeSatiety(dmg, true);

      b.log.push(`💥 ${b.enemy.name} の攻撃！ 満腹度が <span class="num-font">${dmg}</span> 減った！`);
      if (died) {
        b.isDead = true;
      }
      b.turn = 'enemy_confirm';
      renderBattleScreen();
    }

    function handleConfirmPhase() {
      const b = state.battle;
      if (!b) return;

      if (b.turn === 'player_confirm') {
        if (b.winData) {
          const { earnedShells, droppedItem, clearDebuffLog } = b.winData;
          state.shells += earnedShells;

          b.isEnemyCleared = true;
          renderBattleScreen();

          const title = b.isBoss ? '🎉 ぬしを撃退した！' : '🎉 敵を撃退した！';
          const btnLabel = b.isBoss ? 'おうちへ戻る' : '次の階層へ';

          showModal(title, `
            <div class="text-center space-y-2 my-1">
              <div class="text-5xl my-1">✨🦦✨</div>
              <p class="font-black text-red-500 text-sm">${b.enemy.name} を追い払った！</p>
              <p class="text-xs text-slate-200 font-bold"><span class="num-font text-yellow-300 font-bold">${earnedShells}</span> 🐚 拾った！</p>
              ${droppedItem ? `<p class="text-xs text-slate-200">🎁 ${droppedItem.name} をもらった！</p>` : ''}
              ${clearDebuffLog.length > 0 ? `<p class="text-xs text-cyan-300 font-bold border-t border-slate-800 pt-1 mt-1">${clearDebuffLog.join('<br>')}</p>` : ''}
            </div>
          `, [
            {
              text: btnLabel,
              class: 'bg-red-600 hover:bg-red-500 text-white font-black',
              cb: () => {
                state.battle = null;
                if (b.isBoss) {
                  renderHomeScreen();
                } else {
                  if (droppedItem) {
                    obtainItemDirect(droppedItem.id, () => advanceDepth());
                  } else {
                    advanceDepth();
                  }
                }
              }
            }
          ]);
        } else {
          b.turn = 'enemy';
          b.log.push('敵の番');
          renderBattleScreen();
        }
      } else if (b.turn === 'enemy_confirm') {
        if (b.isDead) {
          state.battle = null;
          handleDeathPenalty();
        } else if (b.isBlownAway) {
          state.battle = null;
          state.depth--;
          updateHeaderStats();
          generateCards();
          renderCardSelectionScreen();
        } else {
          b.turn = 'player';
          b.log.push('ラッコの番');
          checkCourage();
          renderBattleScreen();
        }
      }
    }

    // --- PURCHASE OBTAIN LOGIC ---
    function obtainItemViaPurchase(itemId) {
      const master = ITEMS[itemId];
      const newItem = {
        uid: generateUid(),
        id: itemId,
        type: master.type,
        hitRate: master.hitRate || 0,
        def: master.def || 0,
        upgradedHit: itemId === 'favorite_stone' ? state.favoriteStoneUpgrades.upgradedHit : 0,
        upgradedDef: 0,
        upgrades: itemId === 'favorite_stone' ? state.favoriteStoneUpgrades.upgrades : 0
      };

      state.bag.push(newItem);
      updateHeaderStats();

      if (state.bag.length > 20) {
        renderPendingItemModal(newItem.uid);
      } else {
        const isFood = master.type === 'food';
        const isTreasure = master.type === 'treasure';

        let titleColor = 'text-blue-400';
        let btnClass = 'bg-blue-600 hover:bg-blue-500 text-white font-bold';

        if (isFood) {
          titleColor = 'text-lime-400';
          btnClass = 'bg-lime-600 hover:bg-lime-500 text-white font-bold';
        } else if (isTreasure) {
          titleColor = 'text-yellow-300';
          btnClass = 'bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black';
        }

        showModal('🎁 アイテムを購入！', `
          <div class="text-center space-y-2 my-1">
            <div class="text-5xl my-2 animate-bounce">${master.icon}</div>
            <div class="font-bold ${titleColor} text-sm">${master.name} を買った！</div>
            <p class="text-xs text-slate-400">${master.effect || (master.hitRate ? `撃退率 <span class="num-font">+${master.hitRate}%</span>` : `防御力 <span class="num-font">+${master.def}</span>`)}</p>
          </div>
        `, [
          {
            text: 'らこっ',
            class: btnClass,
            cb: () => {
              if (state.currentScreen === 'dolphinShop') renderDolphinShop(state.dolphinShopTab);
              else if (state.currentScreen === 'market') renderMarketScreen(state.marketDialog, state.marketShopTab);
            }
          }
        ]);
      }
    }

    function obtainItemDirect(itemId, onComplete) {
      const master = ITEMS[itemId];
      const newItem = {
        uid: generateUid(),
        id: itemId,
        type: master.type,
        hitRate: master.hitRate || 0,
        def: master.def || 0,
        upgradedHit: itemId === 'favorite_stone' ? state.favoriteStoneUpgrades.upgradedHit : 0,
        upgradedDef: 0,
        upgrades: itemId === 'favorite_stone' ? state.favoriteStoneUpgrades.upgrades : 0
      };

      state.bag.push(newItem);
      updateHeaderStats();

      if (state.bag.length > 20) {
        renderPendingItemModal(newItem.uid, onComplete);
      } else {
        if (onComplete) onComplete();
      }
    }

    function renderPendingItemModal(tempUid, onComplete) {
      const item = state.bag.find(i => i.uid === tempUid);
      if (!item) {
        if (onComplete) onComplete();
        return;
      }
      const master = ITEMS[item.id];

      showModal('🎒 かばんがいっぱいです！', `
        <div class="text-center space-y-2">
          <p class="text-xs font-bold text-slate-100">アイテムを入手したけど<br>持ちきれないみたい…</p>
          <div class="p-1 inline-block">
            <span class="text-3xl">${master.icon}</span>
            <div class="font-bold text-xs text-white">${master.name}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">
              ${master.effect ? master.effect : ''}
              ${master.type === 'weapon' ? `撃退率 <span class="num-font">+${master.hitRate}%</span>` : ''}
              ${master.type === 'armor' ? `防御力 <span class="num-font">+${master.def}</span>` : ''}
            </div>
          </div>
        </div>
      `, [
        {
          text: 'かばん整理',
          class: 'bg-amber-400 text-slate-950 font-black',
          cb: () => openBag(onComplete)
        },
        {
          text: '諦める',
          class: 'bg-rose-700 hover:bg-rose-600 text-white font-bold shadow',
          cb: () => {
            const idx = state.bag.findIndex(i => i.uid === tempUid);
            if (idx !== -1) state.bag.splice(idx, 1);
            updateHeaderStats();
            if (onComplete) onComplete();
          }
        }
      ]);
    }

    // --- BAG UI ---
    let pendingCallbackOnClose = null;

    function openBag(onCompleteCb = null) {
      state.hiddenCommandStep = 0;
      if (onCompleteCb) pendingCallbackOnClose = onCompleteCb;
      state.isBagOpen = true;
      updateHeaderStats();

      const main = document.getElementById('main-content');
      main.innerHTML = getBagHTML();
      attachScrollGuide('bag-scroll');
    }

    function closeBag() {
      if (state.bag.length > 20) {
        showModal('🎒 かばんがいっぱい！', `<p class="text-center text-xs font-bold text-slate-200">アイテムを使ったり捨てたりして<br>空きを作ろう</p>`, [
          { text: 'らこっ', class: 'bg-amber-400 text-slate-950 font-black', cb: () => openBag(pendingCallbackOnClose) }
        ]);
        return;
      }

      state.isBagOpen = false;
      updateHeaderStats();

      if (pendingCallbackOnClose) {
        const cb = pendingCallbackOnClose;
        pendingCallbackOnClose = null;
        cb();
      } else {
        switch (state.currentScreen) {
          case 'home': renderHomeScreen(); break;
          case 'dolphinShop': renderDolphinShop(state.dolphinShopTab); break;
          case 'exploration': renderCardSelectionScreen(); break;
          case 'battle': if (state.battle) renderBattleScreen(); else renderHomeScreen(); break;
          case 'market': renderMarketScreen(state.marketDialog, state.marketShopTab); break;
          case 'smith': renderSmithScreen(); break;
        }
      }
    }

    function getBagHTML() {
      const tabItems = state.bag.filter(item => ITEMS[item.id].type === state.activeBagTab);

      return `
        <div class="bg-slate-950 rounded-3xl p-3 sm:p-4 w-full h-full shadow-2xl flex flex-col justify-between border-2 border-amber-400/80 overflow-hidden relative">
          <div class="flex-1 overflow-hidden flex flex-col relative">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2 flex-shrink-0">
              <div class="flex items-center gap-2">
                <span class="text-2xl">🎒</span>
                <h3 class="font-black text-slate-100 text-base">ラッコかばん <span class="num-font text-xs ${state.bag.length > 20 ? 'text-red-400 font-bold' : 'text-slate-400'}">(${state.bag.length}/20)</span></h3>
              </div>
            </div>

            <div class="grid grid-cols-4 gap-1 border-b border-slate-800 pb-2 mb-2 flex-shrink-0">
              <button onclick="state.activeBagTab='food'; openBag();" class="py-1.5 text-center text-xs font-bold rounded-xl ${state.activeBagTab === 'food' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-400 bg-slate-900'}">🦪 食べ物</button>
              <button onclick="state.activeBagTab='treasure'; openBag();" class="py-1.5 text-center text-xs font-bold rounded-xl ${state.activeBagTab === 'treasure' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-400 bg-slate-900'}">👑 お宝</button>
              <button onclick="state.activeBagTab='weapon'; openBag();" class="py-1.5 text-center text-xs font-bold rounded-xl ${state.activeBagTab === 'weapon' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-400 bg-slate-900'}">🗡️ 武器</button>
              <button onclick="state.activeBagTab='armor'; openBag();" class="py-1.5 text-center text-xs font-bold rounded-xl ${state.activeBagTab === 'armor' ? 'bg-amber-400 text-slate-950 shadow-sm font-black' : 'text-slate-400 bg-slate-900'}">🛡️ 防具</button>
            </div>

            <div class="relative flex-1 overflow-hidden">
              <div id="bag-scroll-arrow-up" class="hidden absolute top-1 left-1/2 -translate-x-1/2 z-10 text-emerald-400 font-black text-sm animate-arrow-up pointer-events-none">▲</div>
              <div id="bag-scroll-arrow-down" class="hidden absolute bottom-1 left-1/2 -translate-x-1/2 z-10 text-emerald-400 font-black text-sm animate-arrow-down pointer-events-none">▼</div>

              <div id="bag-scroll" class="space-y-2 overflow-y-auto scroll-container h-full pr-1">
                ${tabItems.length === 0 ? '<p class="text-xs text-slate-500 text-center py-12">この分類のアイテムはありません</p>' : ''}
                ${tabItems.map(item => {
                  const master = ITEMS[item.id];
                  const isEquipped = state.equippedWeaponUid === item.uid || state.equippedArmorUid === item.uid;
                  const upgradeBadge = item.upgrades > 0 ? `<span class="text-orange-400 font-extrabold text-xs ml-1">🔥<span class="num-font">${item.upgrades}</span></span>` : '';

                  const sellPrice = state.currentScreen === 'market' ? master.price : Math.floor(master.price * 0.7);

                  return `
                    <div class="bg-slate-900 p-2.5 rounded-2xl border border-slate-800 flex flex-col gap-1.5">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                          <span class="text-2xl">${master.icon}</span>
                          <div>
                            <div class="font-bold text-xs text-slate-100 flex items-center gap-1">
                              ${master.name}${upgradeBadge}
                              ${isEquipped ? '<span class="bg-blue-600 text-white text-[9px] px-1.5 py-0.2 rounded-full font-bold">装備中</span>' : ''}
                            </div>
                            <div class="text-[10px] text-slate-400">
                              ${master.effect ? master.effect : ''}
                              ${master.type === 'weapon' ? `撃退率: <span class="num-font">+${master.hitRate + item.upgradedHit}%</span>` : ''}
                              ${master.type === 'armor' ? `防御力: <span class="num-font">+${master.def + item.upgradedDef}</span>` : ''}
                            </div>
                          </div>
                        </div>
                        ${state.isMarket ? `
                          <button onclick="promptSellItem('${item.uid}')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black px-2.5 py-1 rounded-xl text-xs shadow border border-cyan-300">
                            売る (<span class="num-font">${sellPrice}</span>🐚)
                          </button>
                        ` : ''}
                      </div>

                      <div class="flex gap-1.5 justify-end pt-1 border-t border-slate-800">
                        ${getItemActionButtons(item, isEquipped)}
                        <button onclick="promptDiscardItem('${item.uid}')" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 font-bold px-2 py-1 rounded-xl text-[10px] border border-rose-800">
                          捨てる
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getItemActionButtons(item, isEquipped) {
      const master = ITEMS[item.id];

      if (master.type === 'food') {
        return `<button onclick="handleUseFood('${item.uid}')" class="bg-lime-600 hover:bg-lime-500 text-white font-bold px-3 py-1 rounded-xl text-xs">使う</button>`;
      }

      if (master.type === 'weapon' || master.type === 'armor') {
        if (isEquipped) {
          return `<button onclick="unequipItem('${item.uid}')" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-3 py-1 rounded-xl text-xs">外す</button>`;
        } else {
          return `<button onclick="equipItem('${item.uid}')" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded-xl text-xs">装備</button>`;
        }
      }

      if (master.type === 'treasure') {
        if (master.timing === '【使用不可】' || master.timing === '【自動】') return '';
        return `<button onclick="useTreasureItem('${item.uid}')" class="bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black px-3 py-1 rounded-xl text-xs">使う</button>`;
      }

      return '';
    }

    function handleUseFood(uid) {
      if (state.battle && state.battle.disableFood) {
        showModal('🫟 墨のせいで使えないよ', '<p class="text-center font-bold text-xs text-slate-200">ダイオウイカの墨でベタベタして、今は食べ物を使えない！</p>', [
          { text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }
        ]);
        return;
      }

      const idx = state.bag.findIndex(i => i.uid === uid);
      if (idx === -1) return;

      const item = state.bag[idx];
      const master = ITEMS[item.id];

      if (state.satiety >= state.maxSatiety) {
        showModal('🦦 お腹いっぱい！', `
          <div class="text-center space-y-2">
            <p class="text-xs text-slate-200">満腹度はすでに最大の <span class="num-font font-bold text-amber-300">100</span> です。</p>
            <p class="text-xs text-slate-400">今食べても効果ありませんよ</p>
          </div>
        `, [
          {
            text: 'それでも食べる',
            class: 'bg-lime-600 hover:bg-lime-500 text-white font-bold',
            cb: () => executeEatFood(uid)
          },
          {
            text: 'やめておく',
            class: 'bg-slate-700 text-slate-200 font-bold',
            cb: () => openBag(pendingCallbackOnClose)
          }
        ]);
        return;
      }

      executeEatFood(uid);
    }

    function executeEatFood(uid) {
      const idx = state.bag.findIndex(i => i.uid === uid);
      if (idx === -1) return;

      const item = state.bag[idx];
      const master = ITEMS[item.id];

      const prev = state.satiety;
      state.satiety = Math.min(state.maxSatiety, state.satiety + master.val);
      const next = state.satiety;
      state.bag.splice(idx, 1);

      updateHeaderStats();

      showModal('🙏 いただきます！', `
        <div class="text-center space-y-2">
          <div class="text-4xl my-1">${master.icon}</div>
          <p class="text-xs font-bold text-lime-400">${master.name} を食べた！</p>
          <div class="bg-slate-900 p-2 rounded-xl text-xs font-bold border border-slate-800">
            満腹度: <span class="num-font text-emerald-400 font-bold">${prev}</span> ➔ <span class="num-font text-emerald-400 font-bold">${next}</span>
          </div>
        </div>
      `, [
        {
          text: 'ごちそうさま',
          class: 'bg-lime-600 hover:bg-lime-500 text-white font-bold',
          cb: () => openBag(pendingCallbackOnClose)
        }
      ]);
    }

    function equipItem(uid) {
      const item = state.bag.find(i => i.uid === uid);
      if (!item) return;

      if (item.type === 'weapon') state.equippedWeaponUid = uid;
      if (item.type === 'armor') state.equippedArmorUid = uid;

      updateHeaderStats();
      openBag(pendingCallbackOnClose);
    }

    function unequipItem(uid) {
      if (state.equippedWeaponUid === uid) state.equippedWeaponUid = null;
      if (state.equippedArmorUid === uid) state.equippedArmorUid = null;

      updateHeaderStats();
      openBag(pendingCallbackOnClose);
    }

    function useTreasureItem(uid) {
      const item = state.bag.find(i => i.uid === uid);
      if (!item) return;
      const master = ITEMS[item.id];

      if (state.battle && state.battle.disableTreasure) {
        showModal('⚡️ しびれて使えないよ', '<p class="text-center font-bold text-xs text-slate-200">チクチククラゲの毒で手がしびれて、今はお宝を使えない！</p>', [
          { text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }
        ]);
        return;
      }

      const showTimingErrorModal = () => {
        showModal('⚠️使えないみたい', `
          <div class="text-center space-y-1">
            <p class="text-xs text-slate-200">このアイテムは今使えないよ</p>
            <p class="text-xs font-bold text-amber-300">タイミング:${master.timing}</p>
          </div>
        `, [
          { text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }
        ]);
      };

      if (state.bag.length > 20 && master.timing !== '【いつでも】') {
        showTimingErrorModal();
        return;
      }

      if (state.currentScreen === 'exploration') {
        const isCardChangeItem = ['flashlight', 'water_lure', 'beach_flag', 'silver_coin', 'octopus_pot', 'secret_map'].includes(item.id);

        if (isCardChangeItem) {
          if (state.depth >= LAST_DEPTH) {
            showModal('⚠️使えないみたい', `<p class="text-center text-xs text-slate-200 font-bold">最後の階層では使えないよ</p>`, [
              { text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }
            ]);
            return;
          }

          state.pendingTargetItem = item;
          closeBag();
          return;
        }
      }

      if (state.currentScreen === 'battle' && state.battle) {
        if (state.battle.turn.includes('confirm')) {
          showModal('⚠️使えないみたい', `<p class="text-center text-xs text-slate-200 font-bold">結果を確認するまではアイテムを使えないよ</p>`, [
            { text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }
          ]);
          return;
        }

        if (['buoy', 'log', 'meat'].includes(item.id)) {
          executeTreasureEffectBattle(item);
          return;
        }
      }

      showTimingErrorModal();
    }

    function executeCardChange(item, cardIdx) {
      const idx = state.bag.findIndex(i => i.uid === item.uid);
      if (idx !== -1) state.bag.splice(idx, 1);

      const targetHoleMap = {
        water_lure: 'treasure_sign',
        beach_flag: 'oasis',
        silver_coin: 'market',
        octopus_pot: 'smith',
        secret_map: 'shortcut'
      };

      const newHole = targetHoleMap[item.id];
      if (newHole) {
        state.currentCards[cardIdx].hole = newHole;
        state.currentCards[cardIdx].prob = HOLE_TYPES[newHole].baseProb || generateTreasureSignProb();
      }

      showModal('✨ カードが変わった！', `
        <div class="text-center space-y-2">
          <div class="text-4xl my-1">🕳️✨</div>
          <p class="text-xs font-bold text-slate-100">${ITEMS[item.id].name} の効果でカードが変化したよ！</p>
        </div>
      `, [
        {
          text: 'らこっ',
          class: 'bg-amber-400 hover:bg-amber-300 text-slate-950 font-black',
          cb: () => renderCardSelectionScreen()
        }
      ]);
    }

    function executeFlashlight(item, cardIdx) {
      const idx = state.bag.findIndex(i => i.uid === item.uid);
      if (idx !== -1) state.bag.splice(idx, 1);

      const targetCard = state.currentCards[cardIdx];
      const determinedEvent = rollEvent(targetCard.prob);

      targetCard.prob = { [determinedEvent]: 100 };
      const eventMeta = EVENT_META[determinedEvent];

      showModal('🔦 照らしだした！', `
        <div class="text-center space-y-2">
          <div class="text-4xl my-1">🔦✨</div>
          <p class="text-xs font-bold text-slate-100">カードを照らすと…</p>
          <p class="text-sm font-black ${eventMeta.color}">「${eventMeta.name}」が発生することが判明した！</p>
        </div>
      `, [
        {
          text: 'らこっ',
          class: 'bg-amber-400 hover:bg-amber-300 text-slate-950 font-black',
          cb: () => renderCardSelectionScreen()
        }
      ]);
    }

    function executeTreasureEffectBattle(item) {
      const b = state.battle;
      const idx = state.bag.findIndex(i => i.uid === item.uid);

      if (item.id === 'buoy') {
        state.bag.splice(idx, 1);
        state.battle = null;
        state.isBagOpen = false;
        showModal('🛟 緊急脱出！', '<p class="text-center font-bold text-slate-200">お助けうきわで戦闘を回避した！</p>', [
          { text: '引き返す', class: 'bg-yellow-400 hover:bg-yellow-300 text-slate-950 font-black', cb: () => renderCardSelectionScreen() }
        ]);
        return;
      }

      if (item.id === 'log') {
        if (b.turn !== 'enemy') {
          showModal('⚠️使えないみたい', `
            <div class="text-center space-y-1">
              <p class="text-xs text-slate-200">このアイテムは今使えないよ</p>
              <p class="text-xs font-bold text-amber-300">タイミング:【敵の番】</p>
            </div>
          `, [{ text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }]);
          return;
        }
        state.bag.splice(idx, 1);
        b.turn = 'player';
        b.log.push('🪵 身代わり丸太を使った！ 敵の番をスキップ！');
        b.log.push('ラッコの番');
        checkCourage();
        state.isBagOpen = false;
        renderBattleScreen();
        return;
      }

      if (item.id === 'meat') {
        if (b.turn !== 'player') {
          showModal('⚠️使えないみたい', `
            <div class="text-center space-y-1">
              <p class="text-xs text-slate-200">このアイテムは今使えないよ</p>
              <p class="text-xs font-bold text-amber-300">タイミング:【ラッコの番】</p>
            </div>
          `, [{ text: 'らこっ', class: 'bg-slate-700 text-white font-bold', cb: () => openBag(pendingCallbackOnClose) }]);
          return;
        }
        state.bag.splice(idx, 1);
        b.buffHitMultiplier *= 2;
        b.log.push('💊 ビタミン剤を飲んだ！ 撃退率が一度だけ <span class="num-font">2</span> 倍になる！');
        state.isBagOpen = false;
        renderBattleScreen();
        return;
      }
    }

    function promptDiscardItem(uid) {
      const item = state.bag.find(i => i.uid === uid);
      if (!item) return;

      showModal('🗑️ 確認', `<p class="text-center font-bold text-slate-100">本当に ${ITEMS[item.id].name} を捨てていい？</p>`, [
        {
          text: '捨てる',
          class: 'bg-rose-950/80 hover:bg-rose-900 text-rose-300 font-bold border border-rose-800',
          cb: () => {
            const idx = state.bag.findIndex(i => i.uid === uid);
            state.bag.splice(idx, 1);
            if (state.equippedWeaponUid === uid) state.equippedWeaponUid = null;
            if (state.equippedArmorUid === uid) state.equippedArmorUid = null;

            syncFavoriteStoneDolphinStock();
            updateHeaderStats();
            openBag(pendingCallbackOnClose);
          }
        },
        { text: 'やめる', class: 'bg-slate-700 text-slate-200', cb: () => openBag(pendingCallbackOnClose) }
      ]);
    }

    async function promptSellItem(uid) {
      const item = state.bag.find(i => i.uid === uid);
      if (!item) return;
      const master = ITEMS[item.id];
      const sellPrice = state.currentScreen === 'market' ? master.price : Math.floor(master.price * 0.7);

      showModal('⚖️ 売却確認', `
        <div class="text-center space-y-2">
          <p class="font-bold text-slate-100">本当に ${master.name} を売っていい？</p>
          <p class="text-xs text-amber-400 font-bold">買取価格: <span class="num-font">${sellPrice}</span> 🐚</p>
        </div>
      `, [
        {
          text: '売る',
          class: 'bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black border border-cyan-300',
          cb: () => {
            const idx = state.bag.findIndex(i => i.uid === uid);
            state.bag.splice(idx, 1);
            if (state.equippedWeaponUid === uid) state.equippedWeaponUid = null;
            if (state.equippedArmorUid === uid) state.equippedArmorUid = null;
            state.shells += sellPrice;

            syncFavoriteStoneDolphinStock();
            updateHeaderStats();
            openBag(pendingCallbackOnClose);
          }
        },
        { text: 'やめる', class: 'bg-slate-700 text-slate-200', cb: () => openBag(pendingCallbackOnClose) }
      ]);
    }

    function showModal(title, htmlContent, buttons = []) {
      const modal = document.getElementById('modal-container');
      document.body.classList.add('modal-active-overlay');
      modal.className = "fixed inset-0 pointer-events-auto z-40 flex items-end sm:items-center justify-center p-3 pb-28 sm:pb-36 pt-16";
      modal.classList.remove('hidden');

      modal.innerHTML = `
        <div class="bg-slate-950 rounded-3xl p-5 w-full max-w-xs shadow-2xl flex flex-col justify-between border-4 border-slate-800 animate-fade-in min-h-[220px]">
          <div>
            <h3 class="font-black text-center text-base text-slate-100 border-b border-slate-800 pb-2 mb-3">${title}</h3>
            <div class="text-xs text-slate-300 space-y-2 mb-4">${htmlContent}</div>
          </div>
          <div class="flex gap-2 justify-center pt-2 border-t border-slate-800/80">
            ${buttons.map((b, idx) => `
              <button id="modal-btn-${idx}" class="flex-1 font-bold py-3 px-3 rounded-2xl text-xs shadow active:scale-95 transition ${b.class}">
                ${b.text}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      buttons.forEach((b, idx) => {
        const btnEl = document.getElementById(`modal-btn-${idx}`);
        if (btnEl) {
          btnEl.onclick = () => {
            document.body.classList.remove('modal-active-overlay');
            modal.classList.add('hidden');
            if (b.cb) b.cb();
          };
        }
      });
    }

    window.onload = function() {
      initGame();
    };
  </script>
</body>
</html>
